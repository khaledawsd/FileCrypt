name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The app is meant to be run locally on whatever the user has, so both
        # platforms matter. 3.12 is the floor imposed by the numpy pin.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

      # The Python suite cannot see the browser half at all, so a syntax error
      # in these files ships silently: the page just stops working, and the
      # form falls back to a native submit that looks almost right. Two seconds
      # here catches that.
      - name: Check browser JavaScript parses
        run: node --check static/js/app.js && node --check static/js/chrome.js && node --check static/js/crypto.js

      - name: Test
        run: python -m pytest -q
